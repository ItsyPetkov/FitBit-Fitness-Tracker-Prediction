version: 2

models:

  - name: stg_minute_mets_narrow_merged_3_4_5
    description: Cleaned and unified minute-level METs data from multiple raw sources.
      Ratio of the energy users are using in a physical activity compared to the energy they would use at rest. Counted in minutes
      Data cleaning involves the parsing of ActivityMinute into DATETIME and standardised column naming.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: activity_minute
        description: Minute-level timestamp of recorded METs during activity.
        tests:
          - not_null

      - name: mets
        description: Ratio during the given minute.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_minute