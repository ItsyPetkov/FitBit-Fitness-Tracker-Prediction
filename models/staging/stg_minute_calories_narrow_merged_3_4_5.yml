version: 2

models:

  - name: stg_minute_calories_narrow_merged_3_4_5
    description: Cleaned and unified minute-level calories data from multiple raw sources.
       Data cleaning involves the parsing of ActivityMinute into DATETIME and standardised column naming.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: activity_minute
        description: Minute-level timestamp of recorded calorie activity.
        tests:
          - not_null

      - name: calories
        description: Calories burned during the given minute.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_minute