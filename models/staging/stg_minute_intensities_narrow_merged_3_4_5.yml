version: 2

models:

  - name: stg_minute_intensities_narrow_merged_3_4_5
    description: Cleaned and unified minute-level intensities data from multiple raw sources.
       Data cleaning involves the parsing of ActivityMinute into DATETIME, casting intensity to STRING and standardised column naming.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: activity_minute
        description: Minute-level timestamp of recorded intensity activity.
        tests:
          - not_null

      - name: intensity
        description: Activity intensity encoded as string values 0–3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3']

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_minute