version: 2

models:

  - name: stg_sleep_day_merged_4_5
    description: Cleaned and unified day-level sleep data from multiple raw sources.
       Data cleaning involves the parsing of SleepDay into DATETIME, casting TotalSleepRecords to STRING and standardised column naming.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: sleep_day
        description: Day-level timestamp of recorded sleep.
        tests:
          - not_null

      - name: total_sleep_records
        description: Total sleep records encoded as string values 1-3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3']

      - name: total_minutes_asleep
        description: Total minutes asleep per day.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_time_in_bed
        description: Total minutes in bed per day.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - sleep_day