version: 2

models:

  - name: stg_daily_calories_merged_4_5
    description: Cleaned and unified day-level calories data from multiple raw sources.
       Data cleaning involves the parsing of ActivityDay into DATE and standardised column naming.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: activity_day
        description: Day-level timestamp of recorded calories.
        tests:
          - not_null

      - name: calories
        description: Total calories burnt per day.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_day