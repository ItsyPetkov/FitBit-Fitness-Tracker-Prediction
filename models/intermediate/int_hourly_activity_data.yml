version: 2

models:

  - name: int_hourly_activity_data
    description: Merged hourly-level activity data from multiple existing views.
      References include; i) stg_hourly_calories_merged_3_4_5; 
      ii) stg_hourly_intensities_merged_3_4_5; and iii) hourly_steps_merged_3_4_5.

    columns:

      - name: user_id
        description: Unique identifier for each Fitbit user.
        tests:
          - not_null

      - name: activity_hour
        description: Hour-level timestamp of recorded activity data.
        tests:
          - not_null

      - name: calories
        description: Calories burned during the given hour.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_steps
        description: Total steps taken during the given hour.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: total_intensity
        description: Total number of intensities during the given hour.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: average_intensity
        description: Average number of intensities during the given hour.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.0

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - user_id
              - activity_hour