[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bellabeat-data-science"
version = "1.0.0"
description = "Machine learning analysis for predicting high-intensity physical activity using Bellabeat wearable data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "google-cloud-bigquery>=3.0.0",
    "db-dtypes>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = []
